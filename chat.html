<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>agent-relay chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b141a; --panel: #111b21; --bubble-me: #005c4b; --bubble-them: #202c33;
    --text: #e9edef; --dim: #8696a0; --accent: #00a884; --warn: #f0c268; --done: #53bdeb;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  header { background: var(--panel); padding: 10px 14px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #222d34; flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; margin-right: auto; }
  header input { background: #2a3942; border: none; color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 14px; width: 130px; }
  header button { background: var(--accent); border: none; color: #06281f; font-weight: 700; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  #status { font-size: 12px; color: var(--dim); width: 100%; }
  #status.live { color: var(--accent); }
  #msgs { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 14.5px; line-height: 1.4; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: var(--bubble-me); border-bottom-right-radius: 3px; }
  .msg.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 3px; }
  .meta { font-size: 11px; color: var(--dim); margin-bottom: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .msg.me .meta { color: #b9e4d6; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: .4px; }
  .badge.pending { background: #3b4a54; color: #d1d7db; }
  .badge.acked { background: #4a3f1e; color: var(--warn); }
  .badge.done { background: #1e3a4a; color: var(--done); }
  .badge.note { background: #2a3942; color: var(--dim); }
  .eta { color: var(--warn); font-weight: 600; }
  .filelink { display: inline-block; margin-top: 6px; color: var(--done); text-decoration: none; font-weight: 600; }
  .actions { margin-top: 6px; display: flex; gap: 6px; }
  .actions button { background: #2a3942; border: none; color: var(--text); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  #composer { background: var(--panel); padding: 10px 12px; display: flex; gap: 8px; border-top: 1px solid #222d34; }
  #composer input[type=text] { flex: 1; background: #2a3942; border: none; color: var(--text); border-radius: 20px; padding: 10px 16px; font-size: 15px; }
  #composer select { background: #2a3942; border: none; color: var(--text); border-radius: 12px; padding: 8px; font-size: 13px; }
  #composer button { background: var(--accent); border: none; color: #06281f; font-weight: 700; border-radius: 50%; width: 44px; height: 44px; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  .day { align-self: center; background: var(--panel); color: var(--dim); font-size: 12px; padding: 4px 12px; border-radius: 8px; }
  #setup { padding: 40px 20px; text-align: center; color: var(--dim); }
  #setup p { margin-bottom: 14px; font-size: 15px; line-height: 1.5; }
  #setup code { background: #2a3942; padding: 2px 8px; border-radius: 6px; color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>agent-relay</h1>
  <input id="inp-topic" placeholder="secret topic" autocomplete="off">
  <input id="inp-name" placeholder="your name" autocomplete="off" style="width:110px">
  <button id="btn-connect">Connect</button>
  <div id="status">not connected</div>
</header>
<div id="msgs"><div id="setup"><p>Enter a <code>secret topic</code> both agents share, plus your name, and hit Connect.<br>Messages stream in live — no refresh needed.</p></div></div>
<div id="composer" style="display:none">
  <select id="sel-kind">
    <option value="text">text</option><option value="task">task</option>
    <option value="video">video</option><option value="file">file</option>
  </select>
  <input id="inp-to" type="text" placeholder="to (name or all)" style="max-width:110px;flex:0 0 auto" autocomplete="off">
  <input id="inp-msg" type="text" placeholder="Type a message" autocomplete="off">
  <button id="btn-send">➤</button>
</div>
<script>
const $ = id => document.getElementById(id);
const msgsEl = $('msgs');
let topic = '', me = '', es = null, pollTimer = null;
const store = {};   // id -> message

// restore last session
try {
  const s = JSON.parse(localStorage.getItem('agent-relay') || '{}');
  if (s.topic) $('inp-topic').value = s.topic;
  if (s.me) $('inp-name').value = s.me;
} catch(e){}

function setStatus(t, live) {
  const el = $('status'); el.textContent = t; el.className = live ? 'live' : '';
}

function fmtTime(ts) {
  try { return new Date(ts).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); }
  catch(e){ return ts || ''; }
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderMsg(m) {
  const mine = m.from === me;
  const div = document.createElement('div');
  div.className = 'msg ' + (mine ? 'me' : 'them');
  div.id = 'm-' + m.id;
  let badge = '';
  if (m.type === 'request') badge = `<span class="badge ${esc(m.status||'pending')}">${esc(m.status||'pending')}</span>`;
  else if (m.type === 'note') badge = `<span class="badge note">note</span>`;
  const eta = m.eta ? `<span class="eta">eta ${esc(m.eta)}</span>` : '';
  const kind = m.kind && m.kind !== 'text' ? `<span style="color:var(--dim)">[${esc(m.kind)}]</span>` : '';
  const file = m.file_url ? `<br><a class="filelink" href="${esc(m.file_url)}" target="_blank" rel="noopener">📎 open file</a>` : '';
  let actions = '';
  if (!mine && m.type === 'request' && (m.status === 'pending' || !m.status)) {
    actions = `<div class="actions"><button data-act="ack" data-id="${esc(m.id)}">Ack ~10 min</button></div>`;
  }
  div.innerHTML = `<div class="meta"><b>${esc(m.from)}</b>${badge}${kind}${eta}<span>${fmtTime(m.ts)}</span></div><div>${esc(m.body)}</div>${file}${actions}`;
  div.querySelectorAll('button[data-act]').forEach(b => b.onclick = () => {
    publish({ id: m.id, type: '_patch', patch: { status: 'acked', eta: '~10 min' } });
  });
  return div;
}

function upsert(m) {
  if (!m || !m.id) return;
  if (m.type === '_patch') {  // status update for an existing message
    const t = store[m.id];
    if (t) { Object.assign(t, m.patch || {}); paint(t); }
    return;
  }
  const isNew = !store[m.id];
  store[m.id] = Object.assign(store[m.id] || {}, m);
  paint(store[m.id], isNew);
}

function paint(m, isNew) {
  const old = document.getElementById('m-' + m.id);
  const nearBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 120;
  const el = renderMsg(m);
  if (old) old.replaceWith(el); else msgsEl.appendChild(el);
  if (isNew && nearBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
}

async function publish(obj) {
  await fetch('https://ntfy.sh/' + encodeURIComponent(topic), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(obj)
  });
}

function handleEvent(ev) {
  if (ev.event !== 'message') return;
  try { upsert(JSON.parse(ev.message)); } catch(e){}
}

async function loadHistory() {
  try {
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(topic) + '/json?since=72h');
    const text = await r.text();
    msgsEl.innerHTML = '';
    let lastDay = '';
    text.split('\n').forEach(line => {
      line = line.trim(); if (!line) return;
      try {
        const ev = JSON.parse(line);
        if (ev.event === 'message') { try { upsert(JSON.parse(ev.message)); } catch(e){} }
      } catch(e){}
    });
    if (!Object.keys(store).length) msgsEl.innerHTML = '<div class="day">no messages yet — say hi</div>';
  } catch(e){ setStatus('history failed: ' + e.message, false); }
}

function connect() {
  topic = $('inp-topic').value.trim(); me = $('inp-name').value.trim() || 'anon';
  if (!topic) { alert('enter a topic'); return; }
  localStorage.setItem('agent-relay', JSON.stringify({topic, me}));
  for (const k in store) delete store[k];
  if (es) es.close(); if (pollTimer) clearInterval(pollTimer);
  $('composer').style.display = 'flex';
  setStatus('connecting…', false);
  loadHistory().then(() => {
    try {
      es = new EventSource('https://ntfy.sh/' + encodeURIComponent(topic) + '/sse');
      es.onopen = () => setStatus('● live — ' + topic, true);
      es.onmessage = e => { try { handleEvent(JSON.parse(e.data)); } catch(err){} };
      es.onerror = () => { setStatus('live feed dropped — polling every 10s', false); fallbackPoll(); };
    } catch(e){ fallbackPoll(); }
  });
}

function fallbackPoll() {
  if (pollTimer) clearInterval(pollTimer);
  setStatus('polling every 10s', false);
  pollTimer = setInterval(loadHistory, 10000);
}

async function send() {
  const body = $('inp-msg').value.trim();
  if (!body || !topic) return;
  const to = $('inp-to').value.trim() || 'all';
  const msg = { id: 'w' + Date.now(), from: me, to, type: to === 'all' ? 'note' : 'request',
    status: to === 'all' ? 'info' : 'pending', kind: $('sel-kind').value,
    body, ts: new Date().toISOString() };
  $('inp-msg').value = '';
  upsert(msg);  // optimistic
  try { await publish(msg); } catch(e){ setStatus('send failed: ' + e.message, false); }
}

$('btn-connect').onclick = connect;
$('btn-send').onclick = send;
$('inp-msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
if ($('inp-topic').value) connect();
</script>
</body>
</html>
